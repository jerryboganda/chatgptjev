name: Release

on:
  push:
    tags: ["v*"]
  repository_dispatch:
    types: [release-tag]
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to build (empty = this run's own ref)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (empty = this run's own ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-ref:
    # Resolves what to check out. The auto-release workflow versions and tags a
    # release with the GITHUB_TOKEN; GitHub never triggers workflows from events
    # created by that token, so the tag arrival is delivered here as a
    # repository_dispatch carrying the tag and its SHA.
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      created: ${{ steps.resolve.outputs.created }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: resolve
        env:
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          { echo "tag=$TAG" >> "$GITHUB_OUTPUT"; }
          if [ -n "$TAG" ]; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: build-ref
    if: ${{ github.event_name != 'repository_dispatch' || needs.build-ref.outputs.created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime_asset: chatgpt-jev-windows-amd64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-ref.outputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - run: bun run verify
      - run: bun run app:package
      - run: bun run app:smoke
      - name: Archive Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath "${{ matrix.runtime_asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            ${{ matrix.runtime_asset }}
            launcher/artifacts/*.exe
          if-no-files-found: error

  publish:
    needs: [build-ref, build]
    if: ${{ github.event_name != 'repository_dispatch' || needs.build-ref.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-ref.outputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run licenses
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ needs.build-ref.outputs.ref != '' && needs.build-ref.outputs.ref || github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          test "${RELEASE_TAG#refs/tags/}" = "$expected"
      - name: Add licenses and installers
        run: |
          cp LICENSE release-assets/LICENSE
          cp LICENSES/Bun-1.4.0.md release-assets/Bun-1.4.0.md
          cp dist/THIRD_PARTY_NOTICES.txt release-assets/THIRD_PARTY_NOTICES.txt
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install-launcher.sh release-assets/install-launcher.sh
          cp scripts/install-launcher.ps1 release-assets/install-launcher.ps1
      - name: Flatten release assets
        run: |
          cd release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            mv "$file" "$name"
          done < <(find . -mindepth 2 -type f -print0 | sort -z)
          find . -mindepth 1 -type d -empty -delete
      - name: Create checksums
        run: |
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" checksums.txt
      - name: Verify every built asset is checksummed
        run: |
          cd release-assets
          missing=""
          while IFS= read -r -d '' file; do
            name="${file#./}"
            if [ "$name" = checksums.txt ]; then continue; fi
            if ! awk -v asset="$name" '$2 == asset { found = 1 } END { exit found ? 0 : 1 }' checksums.txt; then
              missing="$missing $name"
            fi
          done < <(find . -type f -print0)
          if [ -n "$missing" ]; then
            echo "checksums.txt is missing entries for:$missing" >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-ref.outputs.tag }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          RELEASE_NAME="${GITHUB_REF_NAME}"
          if [ -n "$TAG" ]; then RELEASE_NAME="$TAG"; fi
          echo "Publishing release $RELEASE_NAME"
          test "${#release_files[@]}" -gt 0
          release_flags=(--latest)
          if [[ "$RELEASE_NAME" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_NAME" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              "${release_flags[@]}"
          else
            gh release create "$RELEASE_NAME" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              "${release_flags[@]}" \
              --generate-notes
          fi

          published_manifest="$(mktemp)"
          gh release view "$RELEASE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name != "checksums.txt") | [.name, .digest] | @tsv' \
            | while IFS=$'\t' read -r name digest; do
                if [[ "$digest" != sha256:* || -z "${digest#sha256:}" ]]; then
                  echo "Published asset has no SHA-256 digest: $name" >&2
                  exit 1
                fi
                printf '%s  %s\n' "${digest#sha256:}" "$name"
              done \
            | LC_ALL=C sort -k2 > "$published_manifest"
          test -s "$published_manifest"
          mv "$published_manifest" release-assets/checksums.txt
          gh release upload "$RELEASE_NAME" release-assets/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          while IFS=$'\t' read -r name digest; do
            if [ "$name" = checksums.txt ]; then continue; fi
            expected="$(awk -v asset="$name" '$2 == asset { print $1 }' release-assets/checksums.txt)"
            if [ -z "$expected" ] || [ "sha256:$expected" != "$digest" ]; then
              echo "Published asset checksum mismatch: $name" >&2
              exit 1
            fi
          done < <(gh release view "$RELEASE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv')

          local_manifest_digest="$(sha256sum release-assets/checksums.txt | awk '{ print $1 }')"
          remote_manifest_digest="$(gh release view "$RELEASE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name == "checksums.txt") | .digest')"
          test "sha256:$local_manifest_digest" = "$remote_manifest_digest"
